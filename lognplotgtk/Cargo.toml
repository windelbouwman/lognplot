[package]
name = "lognplotgtk"
description = "Visualization tool for live data."
version = "0.1.0"
authors = ["Windel Bouwman <windel@windel.nl>"]
edition = "2018"

[features]
default = []

# Build without hdf5 using: cargo build --no-default-features

[dependencies]
clap = "4"
cairo-rs = "0.21"
futures = "0.3"
glib = "0.21"
gio = "0.21"
gtk = { version = "0.10", package = "gtk4" }
gdk = { version = "0.10", package = "gdk4" }
nalgebra = "0.21"
gdk-pixbuf = "0.21"
hdf5 = { version = "0.8", optional = true }
lognplot = { path = "../lognplot", features=["cairo", "server"] }
log = "0.4"
ndarray = "0.15"
serde = "1.0"
serde_json = "1.0"
simple_logger = "2"
url = "2"
zip = {version = "5", features=["deflate"] }
